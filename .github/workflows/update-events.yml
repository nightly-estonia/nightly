name: Update Tallinn Events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update_events.py'
      - 'data/verified-dj-events.json'
      - '.github/workflows/update-events.yml'
  schedule:
    - cron: '17 7,17 * * *'

permissions:
  contents: write

concurrency:
  group: nightly-event-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import real Tallinn events from public JSON directory
        run: python update_events.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/facebook-events.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Tallinn event listings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
