name: Update Tallinn Events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update_events.py'
      - 'data/verified-dj-events.json'
      - '.github/workflows/update-events.yml'
  schedule:
    # UTC candidates for 08:00 and 16:00 Europe/Tallinn (EET/EEST)
    - cron: '0 5,6,13,14 * * *'

permissions:
  contents: write

concurrency:
  group: nightly-event-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Estonian local schedule
        id: local_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run_import=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Tallinn date +%H)" = "08" ] || [ "$(TZ=Europe/Tallinn date +%H)" = "16" ]; then
            echo "run_import=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_import=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.local_time.outputs.run_import == 'true'
      - uses: actions/setup-python@v5
        if: steps.local_time.outputs.run_import == 'true'
        with:
          python-version: '3.12'
      - name: Import real Tallinn events from public JSON directory
        if: steps.local_time.outputs.run_import == 'true'
        # Apify deliberately disabled to avoid any paid API usage.
        run: python update_events.py
      - name: Commit updated JSON
        if: steps.local_time.outputs.run_import == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/facebook-events.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Tallinn event listings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
